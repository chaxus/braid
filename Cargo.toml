[package]
name = "braid"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "braid"

[[bin]]
name = "braid-helper"
path = "src/bin/braid_helper.rs"

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = true }
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
